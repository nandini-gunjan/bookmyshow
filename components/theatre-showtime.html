<section class="theatre-page">


    <!-- =====================================
         MOVIE SUMMARY
    ====================================== -->

    <section class="movie-summary">

        <div class="movie-summary-container">


            <!-- Poster -->

            <img
                id="showMoviePoster"
                class="show-movie-poster"
                src=""
                alt="Movie Poster"
            >


            <!-- Movie Information -->

            <div class="show-movie-info">

                <h1 id="showMovieTitle">
                    Movie Title
                </h1>


                <div class="show-movie-meta">

                    <span id="showMovieLanguage">
                        Hindi
                    </span>

                    <span>•</span>

                    <span id="showMovieGenre">
                        Action
                    </span>

                    <span>•</span>

                    <span id="showMovieDuration">
                        2h 30m
                    </span>

                </div>


                <p id="showMovieDescription">
                    Select a theatre and showtime to continue.
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================
         DATE SELECTOR
    ====================================== -->

    <section class="date-section">

        <div class="page-container">

            <div class="section-title">

                <h2>
                    Select Date
                </h2>

            </div>


            <div
                class="date-list"
                id="dateList"
            >

                <!-- Dates generated by JS -->

            </div>

        </div>

    </section>



    <!-- =====================================
         FILTER BAR
    ====================================== -->

    <section class="filter-section">

        <div class="page-container">

            <div class="filter-bar">


                <div class="filter-left">

                    <span class="filter-label">
                        Filter by:
                    </span>


                    <button
                        class="filter-button active"
                        data-filter="all"
                    >
                        All
                    </button>


                    <button
                        class="filter-button"
                        data-filter="premium"
                    >
                        Premium
                    </button>


                    <button
                        class="filter-button"
                        data-filter="standard"
                    >
                        Standard
                    </button>

                </div>


                <div class="filter-right">

                    <button
                        class="filter-button"
                        id="priceFilter"
                    >
                        Price
                        <span>⌄</span>
                    </button>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================
         THEATRES
    ====================================== -->

    <section class="theatre-list-section">

        <div class="page-container">


            <div class="theatre-heading">

                <h2>
                    Theatres
                </h2>

                <span id="theatreCount">
                    0 theatres
                </span>

            </div>



            <div
                id="theatreList"
                class="theatre-list"
            >

                <!-- Theatre cards generated by JS -->

            </div>

        </div>

    </section>



    <!-- =====================================
         BOTTOM BAR
    ====================================== -->

    <div
        class="booking-bottom-bar"
        id="bookingBottomBar"
    >

        <div class="booking-bottom-content">


            <div class="selected-show-info">

                <div
                    id="selectedTheatreName"
                    class="selected-theatre-name"
                >
                    Select a showtime
                </div>

                <div
                    id="selectedShowTime"
                    class="selected-time"
                >
                    Choose your preferred theatre and time.
                </div>

            </div>


            <button
                id="continueButton"
                class="continue-button"
                disabled
            >
                Select Showtime
            </button>

        </div>

    </div>


</section>
