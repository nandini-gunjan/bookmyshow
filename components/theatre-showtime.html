<section class="theatre-page">
  <!-- =====================================
         MOVIE HEADER
    ====================================== -->

  <section class="movie-show-header">
    <div class="show-container">
      <img
        id="showMoviePoster"
        class="show-movie-poster"
        src=""
        alt="Movie Poster"
      />

      <div class="show-movie-details">
        <h1 id="showMovieTitle">Loading movie...</h1>

        <div class="movie-meta">
          <span id="showMovieLanguage"> - </span>

          <span>•</span>

          <span id="showMovieGenre"> - </span>

          <span>•</span>

          <span id="showMovieDuration"> - </span>
        </div>

        <p id="showMovieDescription">Loading movie information...</p>
      </div>
    </div>
  </section>

  <!-- =====================================
         DATE SELECTOR
    ====================================== -->

  <section class="date-section">
    <div class="show-container">
      <h2>Select Date</h2>

      <div id="dateList" class="date-list"></div>
    </div>
  </section>

  <!-- =====================================
         FILTERS
    ====================================== -->

  <section class="filter-section">
    <div class="show-container">
      <div class="filter-row">
        <div class="filter-left">
          <span> Filter by: </span>

          <button class="filter-button active" data-filter="all">All</button>

          <button class="filter-button" data-filter="premium">Premium</button>

          <button class="filter-button" data-filter="standard">Standard</button>
        </div>
      </div>
    </div>
  </section>

  <!-- =====================================
         THEATRES
    ====================================== -->

  <section class="theatres-section">
    <div class="show-container">
      <div class="theatre-title-row">
        <h2>Theatres</h2>

        <span id="theatreCount"> 0 theatres </span>
      </div>

      <div id="theatreList" class="theatre-list"></div>
    </div>
  </section>

  <!-- =====================================
         BOOKING BAR
    ====================================== -->

  <div class="booking-bar">
    <div class="booking-bar-inner">
      <div>
        <div id="selectedTheatreName" class="selected-theatre">
          Select a showtime
        </div>

        <div id="selectedShowTime" class="selected-show">
          Choose your theatre and show
        </div>
      </div>

      <button id="continueButton" class="continue-button" disabled>
        Select Showtime
      </button>
    </div>
  </div>
</section>
