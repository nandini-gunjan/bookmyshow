<section class="category-page">

  <!-- =========================================
       HERO CAROUSEL
  ========================================== -->

  <section class="category-hero">

    <!-- Slides will be created dynamically -->

    <div class="hero-slides" id="heroSlides"></div>


    <!-- Carousel Controls -->

    <button class="carousel-btn carousel-prev" aria-label="Previous">
      &#10094;
    </button>

    <button class="carousel-btn carousel-next" aria-label="Next">
      &#10095;
    </button>


    <!-- Carousel Indicators -->

    <div class="carousel-indicators" id="carouselIndicators"></div>

  </section>


  <!-- =========================================
       CATEGORY CONTENT
  ========================================== -->

  <section class="category-content">

    <!-- Heading -->

    <div class="category-heading">

      <div>

        <h2 id="categoryTitle">
          Recommended Movies
        </h2>

        <p id="categorySubtitle">
          Explore the latest and most popular movies
        </p>

      </div>

      <a href="#" class="view-all">
        View All
      </a>

    </div>


    <!-- =========================================
         FILTER BAR
    ========================================== -->

    <div class="category-filters">

      <!-- Filter Button -->

      <button class="filter-btn" id="filterButton">

        <span class="filter-icon">
          ☰
        </span>

        <span>
          Filters
        </span>

      </button>


      <!-- Language Filters -->

      <div class="language-filters">

        <button class="language-btn active" data-language="all">
          All
        </button>

        <button class="language-btn" data-language="hindi">
          Hindi
        </button>

        <button class="language-btn" data-language="english">
          English
        </button>

        <button class="language-btn" data-language="marathi">
          Marathi
        </button>

        <button class="language-btn" data-language="tamil">
          Tamil
        </button>

        <button class="language-btn" data-language="telugu">
          Telugu
        </button>

      </div>

    </div>


    <!-- =========================================
         MOVIE / EVENT CARDS
    ========================================== -->

    <div class="content-grid" id="categoryGrid">
      <!-- Cards inserted by category.js -->

    </div>


    <!-- =========================================
         NO RESULTS
    ========================================== -->

    <div class="no-results" id="noResults" style="display: none">

      <h3>
        No results found
      </h3>

      <p>
        Try selecting another language or category.
      </p>

    </div>

  </section>

</section>
