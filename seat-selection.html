<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Select Seats | BookItBro</title>

    <link
        rel="stylesheet"
        href="css/seat-selection.css"
    >
</head>

<body>

    <header class="seat-header">

        <button
            id="backButton"
            class="back-button"
        >
            ←
        </button>

        <div>
            <h1 id="movieTitle">
                Select Seats
            </h1>

            <p id="showInformation">
                Loading show information...
            </p>
        </div>

    </header>


    <main class="seat-page">

        <!-- SCREEN -->

        <section class="screen-section">

            <div class="screen">
                SCREEN THIS WAY
            </div>

            <div class="screen-glow"></div>

        </section>


        <!-- SEAT AREA -->

        <section class="seat-section">

            <div class="seat-container">

                <div id="seatLayout"></div>

            </div>


            <!-- LEGEND -->

            <div class="seat-legend">

                <div class="legend-item">
                    <span class="seat-demo available"></span>
                    Available
                </div>

                <div class="legend-item">
                    <span class="seat-demo selected"></span>
                    Selected
                </div>

                <div class="legend-item">
                    <span class="seat-demo occupied"></span>
                    Sold
                </div>

            </div>

        </section>


        <!-- BOOKING SUMMARY -->

        <section class="booking-summary">

            <div class="summary-content">

                <div class="summary-info">

                    <span class="summary-label">
                        Selected Seats
                    </span>

                    <strong id="selectedSeats">
                        None
                    </strong>

                </div>


                <div class="summary-info">

                    <span class="summary-label">
                        Tickets
                    </span>

                    <strong id="ticketCount">
                        0
                    </strong>

                </div>


                <div class="summary-info">

                    <span class="summary-label">
                        Total
                    </span>

                    <strong id="totalPrice">
                        ₹0
                    </strong>

                </div>


                <button
                    id="continueButton"
                    class="continue-button"
                    disabled
                >
                    Continue
                </button>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/seat-selection.js"
    ></script>

</body>

</html>
