<section class="category-page">
  <!-- =====================================
         CATEGORY HEADER
    ====================================== -->

  <section class="category-header">
    <div class="category-container">
      <h1>Movies</h1>

      <p>
        Explore the latest movies, upcoming releases and popular films near you.
      </p>
    </div>
  </section>

  <!-- =====================================
         FILTERS
    ====================================== -->

  <section class="category-filter-section">
    <div class="category-container">
      <div class="category-filters">
        <button class="filter-btn active">All</button>

        <button class="filter-btn">Hindi</button>

        <button class="filter-btn">English</button>

        <button class="filter-btn">Tamil</button>

        <button class="filter-btn">Telugu</button>

        <button class="filter-btn">Malayalam</button>
      </div>
    </div>
  </section>

  <!-- =====================================
         MOVIE CONTENT
    ====================================== -->

  <section class="content-section">
    <div class="category-container">
      <div class="section-heading">
        <div>
          <h2>Recommended Movies</h2>

          <p>Movies you might want to watch</p>
        </div>

        <a href="#" class="view-all"> See All </a>
      </div>

      <!-- TMDB MOVIES WILL BE INSERTED HERE -->

      <div id="recommended-movies" class="movie-grid">
        <div class="movie-loading">Loading movies...</div>
      </div>
    </div>
  </section>

  <!-- =====================================
         NOW SHOWING
    ====================================== -->

  <section class="content-section">
    <div class="category-container">
      <div class="section-heading">
        <div>
          <h2>Now Showing</h2>

          <p>Movies currently playing in cinemas</p>
        </div>

        <a href="#" class="view-all"> See All </a>
      </div>

      <div id="now-showing-movies" class="movie-grid">
        <!-- TMDB DATA -->
      </div>
    </div>
  </section>

  <!-- =====================================
         COMING SOON
    ====================================== -->

  <section class="content-section">
    <div class="category-container">
      <div class="section-heading">
        <div>
          <h2>Coming Soon</h2>

          <p>Upcoming movies</p>
        </div>

        <a href="#" class="view-all"> See All </a>
      </div>

      <div id="upcoming-movies" class="movie-grid">
        <!-- TMDB DATA -->
      </div>
    </div>
  </section>
</section>
